<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ytaPDF · Editor de PDF privado en el navegador</title>
    <meta
      name="description"
      content="Une, organiza, firma, rellena y anota PDF sin subirlos a ningún servidor. Todo se procesa en tu navegador, incluso sin conexión."
    />
    <meta name="theme-color" content="#1976d2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme and language before the first paint, so nothing flashes.
      try {
        var theme = localStorage.getItem("ytapdf.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        var locale = localStorage.getItem("ytapdf.locale");
        if (!locale) locale = (navigator.languages || [navigator.language]).some(function (l) { return /^es/i.test(l || ""); }) ? "es" : "en";
        document.documentElement.lang = locale;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/paty.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="ytaPDF · Editor de PDF privado en el navegador" />
    <meta
      property="og:description"
      content="Une, organiza, firma, rellena y anota PDF. Tus archivos nunca salen de tu equipo."
    />
    <meta property="og:url" content="https://ytapdf.vercel.app/" />
    <meta property="og:image" content="https://ytapdf.vercel.app/ytaPDF.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
